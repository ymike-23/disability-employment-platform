spring:
  application:
    name: disability

  datasource:
    url: jdbc:mysql://localhost:3306/disability_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yzr.disability.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # Base64 编码的密钥（至少 256 位 = 32 字节），本密钥仅用于开发环境
  secret: YTJkM2Y1ZjEwMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTA=
  # Token 过期时间（秒），默认 24 小时
  expiration: 86400

logging:
  level:
    com.yzr.disability.mapper: debug